<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CtrlSaptam</title>
  <meta name="theme-color" content="#2f5fe3">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="icon" type="image/png" sizes="64x64" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@600;700&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <div class="app" id="app">
    <header class="top">
      <a class="brand" id="brand" href="dashboard.html" title="All projects" aria-label="CtrlSaptam, all projects">
        <svg class="logo" viewBox="0 0 32 32" role="img" aria-label="CtrlSaptam logo">
          <rect class="logo-bg" width="32" height="32" rx="9"/>
          <path class="logo-s" d="M17.6 10.4C16.8 8.9 15.2 8 13.2 8c-2.6 0-4.4 1.4-4.4 3.4 0 4.3 9.2 2 9.2 7.2 0 2.1-1.9 3.5-4.8 3.5-2.2 0-3.9-.9-4.8-2.4" transform="translate(0 .4)"/>
          <rect class="logo-cursor" x="19.5" y="21" width="7" height="3" rx="1.5"/>
        </svg>
        <span class="brand-name"><span>Ctrl</span>Saptam</span>
      </a>

      <div class="dash-actions" id="dash-actions">
        <button type="button" class="btn" id="dash-open" title="Open a project folder or a zip file" aria-haspopup="menu"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span class="lbl">Open</span></button>
        <button type="button" class="btn primary" id="dash-new" title="Start a new project"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span class="lbl">New project</span></button>
        <button type="button" class="btn icon theme-btn" data-state="auto" title="Theme: follow device" aria-label="Theme: follow device">
            <span class="i-auto"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/></svg></span>
            <span class="i-light"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>
            <span class="i-dark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></span>
          </button>
        <button type="button" class="btn icon" id="phone" aria-pressed="false" title="Phone frame (9:16) for recording" aria-label="Phone frame">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M11 18.5h2"/></svg>
          </button>
      </div>
    </header>

    <main class="dash" id="dash" aria-label="Projects">
      <div class="dash-head">
        <div class="dash-title"><h2>Projects</h2><span class="dash-count" id="dash-count"></span></div>
        <div class="dash-tools">
          <label class="search">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            <input id="dash-search" type="search" placeholder="Search projects" aria-label="Search projects" autocomplete="off">
          </label>
          <div class="seg sm" id="dash-sort" role="group" aria-label="Sort projects">
            <button type="button" data-sort="recent" aria-pressed="true">Recent</button>
            <button type="button" data-sort="name" aria-pressed="false">Name</button>
          </div>
        </div>
      </div>
      <p class="dash-note" id="dash-persist" hidden></p>
      <div class="grid" id="grid"></div>
      <p class="dash-note" id="dash-note" hidden></p>
      <div class="dash-storage" id="dash-storage">
        <p id="dash-storage-text">Projects are saved in this browser.</p>
        <div class="dash-storage-actions">
          <button type="button" class="btn sm" id="keep-safe" hidden title="Ask the browser not to clear your projects automatically">Keep my projects safe</button>
          <button type="button" class="btn sm" id="backup-export" title="Download all projects as one backup file">Backup</button>
          <button type="button" class="btn sm" id="backup-import" title="Restore projects from a backup file">Restore</button>
        </div>
      </div>
      <p class="toast" id="toast" role="status" aria-live="polite"></p>
    </main>
  </div>

  <input type="file" id="zip-input" accept=".zip,application/zip,application/x-zip-compressed" hidden>
  <input type="file" id="folder-input" webkitdirectory directory multiple hidden>
  <input type="file" id="backup-input" accept="application/json,.json" hidden>

  <script src="js/settings.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/templates.js"></script>
  <script src="js/store.js"></script>
  <script src="js/projects.js"></script>
  <script src="js/hooks.js"></script>
  <script src="js/builder.js"></script>
  <script src="js/zip.js"></script>
  <script src="js/folder-import.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/dashboard-page.js"></script>
</body>
</html>
